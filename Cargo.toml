[package]
name = "gameboy-port"
version = "0.1.0"
edition = "2024"

[lib]
name = "gameboy_port"
path = "src/game/lib.rs"

[[bin]]
name = "debug"
path = "src/debug/main.rs"

[[bin]]
name = "zelda"
path = "src/game/bin/zelda.rs"

[dependencies]
minifb = "0.27"
rodio = { version = "0.22", features = ["playback"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
md5 = "0.7"