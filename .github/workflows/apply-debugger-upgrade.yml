name: Apply debugger upgrade

on:
  push:
    branches: [reverse-engineering]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message != 'Implement advanced debugger breakpoints and watchpoints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch debugger
        shell: python
        run: |
          from pathlib import Path
          import re

          # debug.rs
          p = Path('src/debug.rs')
          s = p.read_text()
          s = s.replace('    bus::Bus,', '    bus::{Bus, DebugAccessKind},')
          s = s.replace(
              'pub struct MemoryWatch { pub address: u16, pub kind: WatchType, pub last_value: u8 }\n',
              '''pub struct MemoryWatch { pub address: u16, pub kind: WatchType, pub last_value: u8 }\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub struct BreakpointCondition { pub register: BreakRegister, pub value: u16 }\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum BreakRegister { A, F, B, C, D, E, H, L, SP, PC, Z, N, HFlag, CFlag }\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub struct AdvancedBreakpoint { pub start: u16, pub end: u16, pub condition: Option<BreakpointCondition>, pub temporary: bool }\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub struct AdvancedMemoryWatch { pub start: u16, pub end: u16, pub kind: WatchType }\n''')
          s = s.replace(
              '    pub breakpoints: HashSet<u16>,\n    pub watches: HashMap<u16, MemoryWatch>,',
              '    pub breakpoints: HashSet<u16>,\n    pub advanced_breakpoints: Vec<AdvancedBreakpoint>,\n    pub watches: HashMap<u16, MemoryWatch>,\n    pub advanced_watches: Vec<AdvancedMemoryWatch>,')
          s = s.replace(
              '            breakpoints:HashSet::new(), \n            watches:HashMap::new(),',
              '            breakpoints:HashSet::new(),\n            advanced_breakpoints:Vec::new(),\n            watches:HashMap::new(),\n            advanced_watches:Vec::new(),')

          marker = '    pub fn set_trace_range(&mut self,start:u16,end:u16) {'
          methods = r'''    pub fn add_advanced_breakpoint(&mut self, bp: AdvancedBreakpoint) {
              self.advanced_breakpoints.push(bp);
          }

          pub fn list_advanced_breakpoints(&self) {
              if self.advanced_breakpoints.is_empty() { return; }
              for (i, bp) in self.advanced_breakpoints.iter().enumerate() {
                  let range = if bp.start == bp.end { format!("{:04X}", bp.start) } else { format!("{:04X}:{:04X}", bp.start, bp.end) };
                  let cond = bp.condition.map(|c| format!(" IF {}={:02X}", condition_register_name(c.register), c.value)).unwrap_or_default();
                  let temp = if bp.temporary { " TEMP" } else { "" };
                  println!("BP#{} {}{}{}", i, range, cond, temp);
              }
          }

          pub fn delete_advanced_breakpoint(&mut self, index: usize) -> bool {
              if index < self.advanced_breakpoints.len() { self.advanced_breakpoints.remove(index); true } else { false }
          }

          pub fn add_memory_watch_range(&mut self, start: u16, end: u16, kind: WatchType) {
              self.advanced_watches.push(AdvancedMemoryWatch { start, end, kind });
          }

          fn breakpoint_matches(bp: &AdvancedBreakpoint, cpu: &Cpu) -> bool {
              let in_range = if bp.start <= bp.end { cpu.pc >= bp.start && cpu.pc <= bp.end } else { cpu.pc >= bp.start || cpu.pc <= bp.end };
              if !in_range { return false; }
              match bp.condition { None => true, Some(c) => condition_matches(c, cpu) }
          }

          fn check_advanced_breakpoints(&mut self, cpu: &Cpu, bus: &mut Bus) -> bool {
              for i in 0..self.advanced_breakpoints.len() {
                  if Self::breakpoint_matches(&self.advanced_breakpoints[i], cpu) {
                      let bp = self.advanced_breakpoints[i];
                      if bp.temporary { self.advanced_breakpoints.remove(i); }
                      self.action = DebugAction::Break;
                      self.stop_reason = Some(format!("Breakpoint hit at {:04X}", cpu.pc));
                      self.print_status(cpu);
                      self.print_stop_disassembly(bus, cpu.pc);
                      return false;
                  }
              }
              true
          }

          fn check_access_watches(&mut self, cpu: &Cpu, bus: &mut Bus) {
              if bus.debug_accesses.is_empty() { return; }
              let accesses = std::mem::take(&mut bus.debug_accesses);
              for access in accesses {
                  for watch in &self.advanced_watches {
                      if access.address < watch.start || access.address > watch.end { continue; }
                      let kind_ok = match watch.kind {
                          WatchType::Read => access.kind == DebugAccessKind::Read,
                          WatchType::Write => access.kind == DebugAccessKind::Write,
                          WatchType::Change => access.kind == DebugAccessKind::Write && access.old_value != access.value,
                      };
                      if !kind_ok { continue; }
                      if access.kind == DebugAccessKind::Write {
                          println!("WATCH WRITE ${:04X}: {:02X} -> {:02X} | PC={:04X} | {}", access.address, access.old_value, access.value, access.pc, disassemble_at(bus, access.pc).text);
                      } else {
                          println!("WATCH READ ${:04X}: {:02X} | PC={:04X} | {}", access.address, access.value, access.pc, disassemble_at(bus, access.pc).text);
                      }
                      self.action = DebugAction::Break;
                      self.stop_reason = Some(format!("Watchpoint hit at {:04X}", access.address));
                      self.print_status(cpu);
                      self.print_stop_disassembly(bus, cpu.pc);
                      return;
                  }
              }
          }

'''
          if marker not in s:
              raise SystemExit('debug.rs insertion marker not found')
          s = s.replace(marker, methods + marker, 1)

          s = s.replace(
              '        if self.breakpoints.contains(&cpu.pc) {\n            self.action=DebugAction::Break;',
              '        if !self.check_advanced_breakpoints(cpu, bus) { return false; }\n        if self.breakpoints.contains(&cpu.pc) {\n            self.action=DebugAction::Break;',
              1)
          s = s.replace(
              '    pub fn after_instruction_hook(&mut self, cpu: &Cpu, bus: &mut Bus) {\n        self.check_change_watches(bus);',
              '    pub fn after_instruction_hook(&mut self, cpu: &Cpu, bus: &mut Bus) {\n        self.check_access_watches(cpu, bus);\n        self.check_change_watches(bus);',
              1)

          helper = r'''fn condition_register_name(r: BreakRegister) -> &'static str {
              match r { BreakRegister::A=>"A", BreakRegister::F=>"F", BreakRegister::B=>"B", BreakRegister::C=>"C", BreakRegister::D=>"D", BreakRegister::E=>"E", BreakRegister::H=>"H", BreakRegister::L=>"L", BreakRegister::SP=>"SP", BreakRegister::PC=>"PC", BreakRegister::Z=>"Z", BreakRegister::N=>"N", BreakRegister::HFlag=>"H", BreakRegister::CFlag=>"C" }
          }
          fn condition_matches(c: BreakpointCondition, cpu: &Cpu) -> bool {
              let actual = match c.register { BreakRegister::A=>cpu.a as u16, BreakRegister::F=>cpu.f as u16, BreakRegister::B=>cpu.b as u16, BreakRegister::C=>cpu.c as u16, BreakRegister::D=>cpu.d as u16, BreakRegister::E=>cpu.e as u16, BreakRegister::H=>cpu.h as u16, BreakRegister::L=>cpu.l as u16, BreakRegister::SP=>cpu.sp, BreakRegister::PC=>cpu.pc, BreakRegister::Z=>((cpu.f & 0x80)!=0) as u16, BreakRegister::N=>((cpu.f & 0x40)!=0) as u16, BreakRegister::HFlag=>((cpu.f & 0x20)!=0) as u16, BreakRegister::CFlag=>((cpu.f & 0x10)!=0) as u16 };
              actual == c.value
          }

'''
          marker = 'pub fn disassemble_at(bus:&mut Bus,address:u16)->DisassembledInstruction {'
          if marker not in s: raise SystemExit('debug.rs helper marker not found')
          s = s.replace(marker, helper + marker, 1)

          # Replace ConsoleCommand enum only; preserve the rest of the debugger.
          a = s.index('pub enum ConsoleCommand')
          b = s.index('impl ConsoleCommand', a)
          enum = '''pub enum ConsoleCommand {\n              Help,\n              Breakpoint(u16), BreakpointList, BreakpointDelete(u16), BreakpointClear,\n              BreakpointAdvanced(AdvancedBreakpoint), BreakpointAdvancedDelete(usize),\n              Watch(u16), WatchList, WatchDelete(u16), WatchRange(AdvancedMemoryWatch), WatchRangeDelete(usize),\n              Trace(u16,u16), TraceOff, Disassemble(u16,usize), Step, Continue, Break, Status, Snapshot, Memory(u16,usize), History, Unknown(String),\n          }\n\n          '''
          s = s[:a] + enum + s[b:]

          bp_old = '''            "BP" => {\n                if parts.len() < 2 {\n                    return Self::Unknown(input.to_string());\n                }\n\n                match parts[1].to_ascii_uppercase().as_str() {\n                    "LIST" => Self::BreakpointList,\n                    "CLEAR" => Self::BreakpointClear,\n\n                    "DEL" => {\n                        if parts.len() != 3 {\n                            return Self::Unknown(input.to_string());\n                        }\n\n                        match parse_hex_u16(parts[2]) {\n                            Some(addr) => Self::BreakpointDelete(addr),\n                            None => Self::Unknown(input.to_string()),\n                        }\n                    }\n\n                    _ => match parse_hex_u16(parts[1]) {\n                        Some(addr) => Self::Breakpoint(addr),\n                        None => Self::Unknown(input.to_string()),\n                    },\n                }\n            }'''
          bp_new = '''            "BP" => {\n                if parts.len() < 2 { return Self::Unknown(input.to_string()); }\n                if parts[1].eq_ignore_ascii_case("LIST") { return Self::BreakpointList; }\n                if parts[1].eq_ignore_ascii_case("CLEAR") { return Self::BreakpointClear; }\n                if parts[1].eq_ignore_ascii_case("DEL") {\n                    if parts.len() == 3 {\n                        if let Ok(i) = parts[2].parse::<usize>() { return Self::BreakpointAdvancedDelete(i); }\n                        if let Some(addr) = parse_hex_u16(parts[2]) { return Self::BreakpointDelete(addr); }\n                    }\n                    return Self::Unknown(input.to_string());\n                }\n                let mut idx = 1;\n                let mut temporary = false;\n                if parts[idx].eq_ignore_ascii_case("TEMP") { temporary = true; idx += 1; }\n                if idx >= parts.len() { return Self::Unknown(input.to_string()); }\n                let mut range = parts[idx].split(':');\n                let start = match range.next().and_then(parse_hex_u16) { Some(v) => v, None => return Self::Unknown(input.to_string()) };\n                let end = range.next().and_then(parse_hex_u16).unwrap_or(start);\n                idx += 1;\n                let mut condition = None;\n                while idx < parts.len() {\n                    if parts[idx].eq_ignore_ascii_case("TEMP") { temporary = true; idx += 1; continue; }\n                    if parts[idx].eq_ignore_ascii_case("IF") && idx + 1 < parts.len() {\n                        if let Some(c) = parse_condition(parts[idx + 1]) { condition = Some(c); idx += 2; continue; }\n                    }\n                    return Self::Unknown(input.to_string());\n                }\n                Self::BreakpointAdvanced(AdvancedBreakpoint { start, end, condition, temporary })\n            }'''
          if bp_old not in s: raise SystemExit('BP parser block not found')
          s = s.replace(bp_old, bp_new, 1)

          watch_old = '''            "WATCH" => {\n                if parts.len() < 2 {\n                    return Self::Unknown(input.to_string());\n                }\n\n                match parts[1].to_ascii_uppercase().as_str() {\n                    "LIST" => Self::WatchList,\n\n                    "DEL" => {\n                        if parts.len() != 3 {\n                            return Self::Unknown(input.to_string());\n                        }\n\n                        match parse_hex_u16(parts[2]) {\n                            Some(addr) => Self::WatchDelete(addr),\n                            None => Self::Unknown(input.to_string()),\n                        }\n                    }\n\n                    _ => match parse_hex_u16(parts[1]) {\n                        Some(addr) => Self::Watch(addr),\n                        None => Self::Unknown(input.to_string()),\n                    },\n                }\n            }'''
          watch_new = '''            "WATCH" => {\n                if parts.len() < 2 { return Self::Unknown(input.to_string()); }\n                if parts[1].eq_ignore_ascii_case("LIST") { return Self::WatchList; }\n                if parts[1].eq_ignore_ascii_case("DEL") {\n                    if parts.len() == 3 {\n                        if let Ok(i) = parts[2].parse::<usize>() { return Self::WatchRangeDelete(i); }\n                        if let Some(a) = parse_hex_u16(parts[2]) { return Self::WatchDelete(a); }\n                    }\n                    return Self::Unknown(input.to_string());\n                }\n                let mut idx = 1;\n                let kind = match parts[idx].to_ascii_uppercase().as_str() {\n                    "READ" => { idx += 1; WatchType::Read },\n                    "WRITE" => { idx += 1; WatchType::Write },\n                    "CHANGE" => { idx += 1; WatchType::Change },\n                    _ => WatchType::Change,\n                };\n                if idx >= parts.len() { return Self::Unknown(input.to_string()); }\n                let mut range = parts[idx].split(':');\n                let start = range.next().and_then(parse_hex_u16);\n                let end = range.next().and_then(parse_hex_u16).or(start);\n                match (start, end) {\n                    (Some(start), Some(end)) => Self::WatchRange(AdvancedMemoryWatch { start, end, kind }),\n                    _ => Self::Unknown(input.to_string()),\n                }\n            }'''
          if watch_old not in s: raise SystemExit('WATCH parser block not found')
          s = s.replace(watch_old, watch_new, 1)

          s = s.replace('''            ConsoleCommand::BreakpointClear => {\n                self.clear_breakpoints();\n                println!("All breakpoints cleared.");\n            }''','''            ConsoleCommand::BreakpointClear => {\n                self.clear_breakpoints();\n                self.advanced_breakpoints.clear();\n                println!("All breakpoints cleared.");\n            }\n\n            ConsoleCommand::BreakpointAdvanced(bp) => {\n                self.add_advanced_breakpoint(bp);\n                println!("Advanced breakpoint added.");\n            }\n\n            ConsoleCommand::BreakpointAdvancedDelete(i) => {\n                if self.delete_advanced_breakpoint(i) { println!("Breakpoint #{} removed.", i); } else { println!("No breakpoint #{}.", i); }\n            }''',1)
          s = s.replace('''            ConsoleCommand::WatchDelete(address) => {\n                self.unwatch(address);\n                println!("Watchpoint removed: {:04X}", address);\n            }''','''            ConsoleCommand::WatchDelete(address) => {\n                self.unwatch(address);\n                println!("Watchpoint removed: {:04X}", address);\n            }\n\n            ConsoleCommand::WatchRange(w) => {\n                self.add_memory_watch_range(w.start, w.end, w.kind);\n                println!("Watchpoint range added: {:04X}:{:04X} ({:?})", w.start, w.end, w.kind);\n            }\n\n            ConsoleCommand::WatchRangeDelete(i) => {\n                if i < self.advanced_watches.len() { self.advanced_watches.remove(i); println!("Watchpoint #{} removed.", i); } else { println!("No watchpoint #{}.", i); }\n            }''',1)
          s = s.replace('''            ConsoleCommand::BreakpointList => {\n                self.list_breakpoints();\n            }''','''            ConsoleCommand::BreakpointList => {\n                self.list_breakpoints();\n                self.list_advanced_breakpoints();\n            }''',1)
          s = s.replace('''            ConsoleCommand::WatchList => {\n                self.list_watches();\n            }''','''            ConsoleCommand::WatchList => {\n                self.list_watches();\n                for (i, w) in self.advanced_watches.iter().enumerate() {\n                    println!("WATCH#{} ${:04X}:${:04X} ({:?})", i, w.start, w.end, w.kind);\n                }\n            }''',1)
          s = s.replace('println!("BP <ADDR>       - dodaj breakpoint");','''println!("BP <ADDR>       - dodaj breakpoint");\n                println!("BP <ADDR> IF A=05 - breakpoint warunkowy");\n                println!("BP <START>:<END> - breakpoint zakresu");\n                println!("BP TEMP <ADDR>   - breakpoint jednorazowy");''',1)
          s = s.replace('println!("WATCH <ADDR>    - obserwuj zmianę pamięci");','''println!("WATCH <ADDR>    - obserwuj zmianę pamięci");\n                println!("WATCH READ <ADDR> / WATCH WRITE <ADDR>");\n                println!("WATCH <START>:<END> - zakres pamięci");''',1)
          s = s.replace('fn parse_hex_u16(value: &str) -> Option<u16> {','''fn parse_condition(value: &str) -> Option<BreakpointCondition> {\n              let mut it = value.split('=');\n              let reg = it.next()?.to_ascii_uppercase();\n              let val = parse_hex_u16(it.next()?)?;\n              let register = match reg.as_str() {\n                  "A"=>BreakRegister::A,"F"=>BreakRegister::F,"B"=>BreakRegister::B,"C"=>BreakRegister::C,"D"=>BreakRegister::D,"E"=>BreakRegister::E,"H"=>BreakRegister::H,"L"=>BreakRegister::L,"SP"=>BreakRegister::SP,"PC"=>BreakRegister::PC,"Z"=>BreakRegister::Z,"N"=>BreakRegister::N,"HFLAG"=>BreakRegister::HFlag,"CFLAG"=>BreakRegister::CFlag,_=>return None\n              };\n              Some(BreakpointCondition { register, value: val })\n          }\n\n          fn parse_hex_u16(value: &str) -> Option<u16> {''',1)
          p.write_text(s)

          # bus.rs: record reads/writes only while a CPU instruction is executing.
          p = Path('src/bus.rs')
          s = p.read_text()
          s = s.replace('pub struct Bus {', '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum DebugAccessKind { Read, Write }\n\n#[derive(Clone, Copy, Debug)]\npub struct DebugMemoryAccess { pub address: u16, pub kind: DebugAccessKind, pub value: u8, pub old_value: u8, pub pc: u16 }\n\npub struct Bus {''',1)
          s = s.replace('    pub debug_frames: u64,\n}', '    pub debug_frames: u64,\n    pub debug_tracking: bool,\n    pub debug_pc: u16,\n    pub debug_accesses: Vec<DebugMemoryAccess>,\n}',1)
          s = s.replace('            debug_frames: 0,\n', '            debug_frames: 0,\n            debug_tracking: false,\n            debug_pc: 0,\n            debug_accesses: Vec::new(),\n',1)
          if 'fn read_internal(&mut self, address: u16) -> u8' not in s:
              s = s.replace('    pub fn read(&mut self, address: u16) -> u8 {', '    fn read_internal(&mut self, address: u16) -> u8 {',1)
              s = s.replace('    pub fn write(&mut self, address: u16, value: u8) {', '    fn write_internal(&mut self, address: u16, value: u8) {',1)
              marker = '    fn read_internal(&mut self, address: u16) -> u8 {'
              wrapper = '''    pub fn begin_debug_instruction(&mut self, pc: u16) { self.debug_pc = pc; self.debug_tracking = true; self.debug_accesses.clear(); }\n    pub fn end_debug_instruction(&mut self) { self.debug_tracking = false; }\n\n    pub fn read(&mut self, address: u16) -> u8 {\n        let value = self.read_internal(address);\n        if self.debug_tracking { self.debug_accesses.push(DebugMemoryAccess { address, kind: DebugAccessKind::Read, value, old_value: value, pc: self.debug_pc }); }\n        value\n    }\n\n'''
              s = s.replace(marker, wrapper + marker, 1)
              marker = '    fn write_internal(&mut self, address: u16, value: u8) {'
              wrapper = '''    pub fn write(&mut self, address: u16, value: u8) {\n        let old_value = self.read_internal(address);\n        self.write_internal(address, value);\n        if self.debug_tracking { self.debug_accesses.push(DebugMemoryAccess { address, kind: DebugAccessKind::Write, value, old_value, pc: self.debug_pc }); }\n    }\n\n'''
              s = s.replace(marker, wrapper + marker, 1)
          p.write_text(s)

          # main.rs: bracket the CPU instruction with access tracking.
          p = Path('src/main.rs')
          s = p.read_text()
          s = s.replace('            let cycles = cpu.step(&mut bus);\n            frame_ready = bus.step(cycles, &mut buffer);', '            bus.begin_debug_instruction(cpu.pc);\n            let cycles = cpu.step(&mut bus);\n            bus.end_debug_instruction();\n            frame_ready = bus.step(cycles, &mut buffer);',1)
          p.write_text(s)

      - name: Format and test
        run: |
          cargo fmt -- --check
          cargo test --all

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/debug.rs src/bus.rs src/main.rs
          git diff --cached --quiet || git commit -m "Implement advanced debugger breakpoints and watchpoints"
          git push
          git rm .github/workflows/apply-debugger-upgrade.yml
          git commit -m "Remove temporary debugger upgrade workflow"
          git push
